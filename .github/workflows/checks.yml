name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check_repository.py
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Check all frontend scripts and tests
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath web -Filter '*.js' | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $cosJsTests = @(Get-ChildItem -LiteralPath tests -Filter '*.cjs' | ForEach-Object { $_.FullName })
          node --test @cosJsTests
